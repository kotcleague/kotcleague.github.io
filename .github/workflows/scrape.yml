name: Scrape League Data

on:
  schedule:
    - cron: "17 * * * *" # Hourly at 17 minutes past (UTC), avoiding peak scheduler load
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Validate site build
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet -- public/data/leaderboard.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/leaderboard.json
          git commit -m "Update league data [automated]"
          git push

      - name: Trigger Pages redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --ref "${{ github.ref_name }}"

