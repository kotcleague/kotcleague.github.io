name: Scrape League Data

on:
  schedule:
    - cron: "17 * * * *" # Hourly at 17 minutes past (UTC), avoiding peak scheduler load
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Capture October qualification standings
        id: qualification
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run scrape:qualification

      - name: Validate site build
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          git add public/data/leaderboard.json
          if [ -f public/data/club-match-2026.json ]; then
            git add public/data/club-match-2026.json
          fi
          git diff --cached --quiet -- public/data/leaderboard.json public/data/club-match-2026.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update league data [automated]"
          git push

      - name: Trigger Pages redeploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-pages.yml --ref "${{ github.ref_name }}"

      - name: Report qualification scrape failure
        if: always() && steps.qualification.outcome == 'failure'
        run: |
          echo "::error::October qualification scraping failed. Any previous snapshot was retained; regular league updates were allowed to publish."
          echo "## October qualification scrape failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the qualification step logs. Any prior snapshot was retained. Regular league updates were allowed to publish." >> "$GITHUB_STEP_SUMMARY"
          exit 1
